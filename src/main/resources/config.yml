# ═══════════════════════════════════════════════════════════════
#  KotMiksMenus — основной конфиг
#  Сайт сервера: https://donat.kotmir.tech
#  Все тексты — в формате MiniMessage: https://docs.advntr.dev/minimessage/format.html
#  После правки: /kmenus reload
# ═══════════════════════════════════════════════════════════════

# Часовой пояс для смены ежедневных/еженедельных заданий
timezone: "Europe/Moscow"

# Требовать повторный клик для покупки за рубины (донат-меню, титулы, эффекты)
confirm-purchases: true

rubies:
  # internal — баланс хранится в data.yml; playerpoints — через плагин PlayerPoints
  provider: internal

# ───────────────────────────────────────────────────────────────
#  Кастомные головы. Сюда вставляется Base64 из поля "Value"
#  на https://minecraft-heads.com (также принимается ссылка
#  http://textures.minecraft.net/texture/... или хеш текстуры).
#  Пустое значение — обычная голова Стива.
#  В любом предмете: head: ключ_из_этого_списка
# ───────────────────────────────────────────────────────────────
heads:
  discord: ""
  telegram: ""
  social-coin: ""
  kills: ""
  donate-privileges: ""
  donate-kits: ""
  donate-tools: ""
  donate-cases: ""
  title-common: ""
  title-rare: ""
  title-epic: ""
  title-legendary: ""
  rank-vip: ""
  rank-mvp: ""
  rank-hero: ""
  rank-elite: ""
  rank-god: ""
  rank-ely: ""
  rank-star: ""
  friend-base: ""

# ───────────────────────────────────────────────────────────────
#  /social — привязка соцсетей (воронка на 5 слотов)
#  Ссылки (value) оставлены пустыми — впишите свои.
# ───────────────────────────────────────────────────────────────
social:
  title: "<dark_gray>- Привязка -"
  discord:
    material: PLAYER_HEAD
    head: discord
    name: "<#5865F2>Дискорд"
    lore:
      - "<gray>Привяжи аккаунт к Discord"
      - ""
      - "<#5865F2>▶ Нажми, чтобы начать"
    steps:
      1:
        text: "<#5865F2>[1] <white>Перейди на наш Discord-сервер:"
        button: "<#5865F2><underlined>[Открыть]"
        action: open_url
        value: ""
        hover: "<gray>Открыть ссылку"
      2:
        text: "<#5865F2>[2] <white>Напиши боту команду привязки:"
        button: "<#3be05a><underlined>[Копировать]"
        action: copy
        value: "/link {player}"
        hover: "<gray>Скопировать команду"
  telegram:
    material: PLAYER_HEAD
    head: telegram
    name: "<#2AABEE>Телеграмм"
    lore:
      - "<gray>Привяжи аккаунт к Telegram"
      - ""
      - "<#2AABEE>▶ Нажми, чтобы начать"
    steps:
      1:
        text: "<#2AABEE>[1] <white>Подпишись на наш канал:"
        button: "<#2AABEE><underlined>[Открыть]"
        action: open_url
        value: ""
        hover: "<gray>Открыть ссылку"
      2:
        text: "<#2AABEE>[2] <white>Запусти нашего бота:"
        button: "<#2AABEE><underlined>[Открыть]"
        action: open_url
        value: ""
        hover: "<gray>Открыть ссылку"
      3:
        text: "<#2AABEE>[3] <white>Отправь боту команду привязки:"
        button: "<#3be05a><underlined>[Копировать]"
        action: copy
        value: "/link {player}"
        hover: "<gray>Скопировать команду"

# ───────────────────────────────────────────────────────────────
#  /daily — ежедневная награда (выбрасыватель на 9 слотов)
# ───────────────────────────────────────────────────────────────
daily:
  title: "<dark_gray>- Ежедневная награда -"
  cooldown-hours: 24
  status-ready: "<#3be05a>✔ Нажми, чтобы забрать!"
  status-wait: "<red>⌛ Уже получено! <gray>(ещё {time})"
  item:
    material: ACACIA_BOAT
    name: "<#ffdd00>Ежедневная награда"
    lore:
      - ""
      - "{status}"
      - ""
      - "<gray>Награды:"
      - "{rewards}"
  # строки для отображения в лоре
  reward-lines:
    - "<#3be05a>+ <white>Обычный ящик x1"
    - "<#3be05a>+ <white>2.000 ◉"
  rewards:
    money: 2000
    commands:
      - "crates give {player} common 1"

# ───────────────────────────────────────────────────────────────
#  /kills — награды за убийства (45 слотов)
#  Прогресс берётся из статистики PLAYER_KILLS.
# ───────────────────────────────────────────────────────────────
kills:
  title: "<dark_gray>- Награды за убийства -"
  close:
    slot: 40
    material: ARROW
    name: "<#ff7777>Закрыть"
  states:
    locked:
      material: PLAYER_HEAD
      head: kills
      name: "<#ff5555>{name}"
      lore:
        - ""
        - "<gray>Убийств: <white>{kills}<gray>/<white>{need}"
        - "<gray>Награда: <#ffdd00>{reward}"
        - ""
        - "<red>✖ Не хватает убийств"
    ready:
      material: PLAYER_HEAD
      head: kills
      name: "<#3be05a>{name}"
      glow: true
      lore:
        - ""
        - "<gray>Убийств: <white>{kills}<gray>/<white>{need}"
        - "<gray>Награда: <#ffdd00>{reward}"
        - ""
        - "<#3be05a>✔ Нажми, чтобы забрать!"
    claimed:
      material: PLAYER_HEAD
      head: kills
      name: "<gray>{name}"
      lore:
        - ""
        - "<gray>Убийств: <white>{need}<gray>/<white>{need}"
        - "<gray>Награда: <#ffdd00>{reward}"
        - ""
        - "<gray>✔ Награда получена"
  # money — монеты через Vault; commands — консольные команды ({player})
  levels:
    1:  { name: "Новичок в бою I",   kills: 1,    money: 100 }
    2:  { name: "Новичок в бою II",  kills: 5,    money: 500 }
    3:  { name: "Новичок в бою III", kills: 10,   money: 1500 }
    4:  { name: "Боец I",            kills: 25,   money: 4000 }
    5:  { name: "Боец II",           kills: 50,   money: 8000 }
    6:  { name: "Боец III",          kills: 75,   money: 15000 }
    7:  { name: "Воин I",            kills: 100,  money: 25000 }
    8:  { name: "Воин II",           kills: 150,  money: 40000 }
    9:  { name: "Воин III",          kills: 250,  money: 70000 }
    10: { name: "Убийца",            kills: 400,  money: 110000 }
    11: { name: "Палач",             kills: 600,  money: 170000 }
    12: { name: "Легенда",           kills: 900,  money: 270000 }
    13: { name: "Мифический",        kills: 1200, money: 400000 }
    14: { name: "Абсолют",           kills: 1500, money: 600000 }

