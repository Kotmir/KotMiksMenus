# ═══════════════════════════════════════════════════════════════
#  KotMiksMenus — shop.yml (/shop)
#  Левая колонка (слоты 0,9,18,27,36,45) — вкладки, вторая колонка — разделитель.
#  Товар:
#    material / amount / name / lore / enchants / potion / pdc / glow / head — внешний вид и выдача
#    payment:   money — Vault, item — предмет из инвентаря, none — просто иконка
#    pay-item:  BEACON или social-coin (соц. коин с PDC-тегом)
#    price:     цена за одну покупку
#    shift-stack: true — Shift+ЛКМ покупает stack-size штук (цена × stack-size)
#    commands:  консольные команды вместо выдачи предмета ({player}, {amount})
#    money-reward: начислить монеты через Vault вместо выдачи предмета
# ═══════════════════════════════════════════════════════════════

title: "<dark_gray>- Магазин -"
stack-size: 64

separator:
  material: GRAY_STAINED_GLASS_PANE
  name: " "

# Предмет «Социальный коин» (метка social_coin ставится плагином автоматически).
# Выдача админом: /kmenus givecoin <игрок> <кол-во>
social-coin:
  material: PLAYER_HEAD
  head: social-coin
  name: "<#ffdd00>Социальный коин"
  lore:
    - "<gray>Валюта за подписку на соцсети"
    - "<gray>Узнать подробнее: <white>/social"

# Склонения валют: именительный (1), родительный (2-4), множественный (5+)
pay-names:
  BEACON: ["маяк", "маяка", "маяков"]
  social-coin: ["соц. коин", "соц. коина", "соц. коинов"]

format:
  price: "<gray>Цена: <#ffdd00>{price}"
  click-buy: "<#3be05a>▶ ЛКМ <gray>— купить"
  click-stack: "<#3be05a>▶ Shift+ЛКМ <gray>— стак ({stack} шт.) за <white>{price}"

