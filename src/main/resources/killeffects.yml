# ═══════════════════════════════════════════════════════════════
#  KotMiksMenus — killeffects.yml (/killeffects)
#  ЛКМ — купить за рубины / выбрать, ПКМ — предпросмотр.
#  До 27 эффектов (слоты 0..26).
#
#  Действия (actions):
#    PARTICLE:ИМЯ:количество:разброс[:скорость]   — частицы (Particle из Bukkit)
#    SOUND:ключ.звука:громкость:тон               — звук (ключ как в игре: entity.lightning_bolt.thunder)
#    LIGHTNING                                    — визуальная молния без урона
#    FIREWORK:#RRGGBB                             — мгновенный фейерверк
# ═══════════════════════════════════════════════════════════════

title: "<dark_gray>Эффекты убийства"

format:
  price: "<gray>Цена: <#ff4d6d>{price} ♦"
  owned: "<#3be05a>✔ Куплено"
  selected: "<#3be05a>✔ Выбрано"
  click-buy: "<#3be05a>▶ ЛКМ <gray>— купить"
  click-select: "<#3be05a>▶ ЛКМ <gray>— выбрать"
  click-preview: "<#ffdd00>▶ ПКМ <gray>— предпросмотр"

clear:
  slot: 31
  material: BARRIER
  name: "<#ff7777>Отключить эффект"
  lore:
    - "<gray>Убирает выбранный эффект"

