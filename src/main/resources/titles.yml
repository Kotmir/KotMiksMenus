# ═══════════════════════════════════════════════════════════════
#  KotMiksMenus — titles.yml (/titles, /title)
#  Админ-команда: /titles give <игрок> <id_титула>
#  Плейсхолдер выбранного титула: %kotmiksmenus_title%
#  Титулы показываются по 18 на страницу, страниц может быть сколько угодно.
# ═══════════════════════════════════════════════════════════════

title: "<dark_gray>- Титулы -"

info:
  slot: 4
  material: PAPER
  name: "<white>Титулы"
  lore:
    - "<gray>Титул отображается рядом с вашим ником."
    - ""
    - "<gray>Редкости:"
    - "<#00ff66> • Обычные <dark_gray>— <#ff4d6d>29 ♦"
    - "<#3b82f6> • Редкие <dark_gray>— <#ff4d6d>59 ♦"
    - "<#a855f7> • Эпические <dark_gray>— <#ff4d6d>99 ♦"
    - "<#ffaa00> • Легендарные <dark_gray>— <#ff4d6d>149 ♦"

clear:
  slot: 22
  material: TURTLE_EGG
  name: "<#3be0a0>Очистить титул"
  lore:
    - "<gray>Сейчас: {title}"
    - ""
    - "<#3be0a0>▶ Нажми, чтобы убрать титул"

submenu:
  title: "<dark_gray>- {rarity} титулы [{page}/{pages}] -"
  filler: GRAY_STAINED_GLASS_PANE
  prev:
    slot: 30
    material: ARROW
    name: "<white>← Назад"
  next:
    slot: 32
    material: ARROW
    name: "<white>Вперёд →"
  back:
    slot: 31
    material: BARRIER
    name: "<#ff7777>Вернуться назад"
  # Состояния титула: selected — выбран, owned — куплен, locked — закрыт
  title-item:
    selected:
      material: NAME_TAG
      name: "{display}"
      glow: true
      lore:
        - ""
        - "<gray>Предпросмотр: <white>{player} {display}"
        - ""
        - "<#3be05a>✔ Выбран"
    owned:
      material: NAME_TAG
      name: "{display}"
      lore:
        - ""
        - "<gray>Предпросмотр: <white>{player} {display}"
        - ""
        - "<#3be05a>▶ ЛКМ <gray>— выбрать"
    locked:
      material: NAME_TAG
      name: "{display}"
      lore:
        - ""
        - "<gray>Предпросмотр: <white>{player} {display}"
        - "<gray>Редкость: {rarity}"
        - ""
        - "<gray>Цена: <#ff4d6d>{price} ♦"
        - "<#ffdd00>▶ ПКМ <gray>— купить"

