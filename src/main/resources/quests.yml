      1:
        type: BREAK_BLOCK
        keys: [OAK_LOG, BIRCH_LOG, SPRUCE_LOG, JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG, MANGROVE_LOG, CHERRY_LOG]
        amount: 100
        text: "Срубить <white>100<gray> брёвен"
