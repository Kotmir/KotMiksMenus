# ═══════════════════════════════════════════════════════════════
#  KotMiksMenus — quests.yml (/quests, /quest)
#  Квесты выполняются строго по порядку, прогресс засчитывается только активному.
#  Задача: type = BREAK_BLOCK | PLACE_BLOCK | KILL_PLAYER | KILL_MOB | FISH
#          keys = материалы блоков / типы мобов (пусто — любые)
#  Награда: money (Vault) · rewards (item:/money:/rubies:/bpcoins:/cmd:) · commands (консоль)
#           reward-text — текст награды в меню
# ═══════════════════════════════════════════════════════════════

title: "<dark_gray>- Начальные квесты -"

format:
  task: " <#d946ef>▪ <white>{text} <gray>({label} <white>{current}<gray>)"
  task-done: " <#3be05a>✔ <gray>{text} ({label} {current})"

states:
  active:
    material: AMETHYST_SHARD
    name: "<#d946ef>Квест #{num}"
    glow: true
    lore:
      - ""
      - "<#d946ef>Описание:"
      - "{description}"
      - ""
      - "<#d946ef>Задание:"
      - "{tasks}"
      - ""
      - "<#d946ef>Награда:"
      - " <#ffdd00>{reward}"
  locked:
    material: RED_CONCRETE
    name: "<red>Квест #{num}"
    lore:
      - ""
      - "<red>✖ Квест закрыт"
      - "<gray>Выполните предыдущий квест"
      - ""
      - "<#d946ef>Награда:"
      - " <#ffdd00>{reward}"
  done:
    material: LIME_CONCRETE
    name: "<#3be05a>Квест #{num}"
    lore:
      - ""
      - "<#d946ef>Задание:"
      - "{tasks}"
      - ""
      - "<#3be05a>✔ Выполнено"

quests:
  1:
    description:
      - "<gray>Монетки <#ffdd00>◉<gray> — главная валюта сервера."
      - "<gray>Их можно добыть в зоне шахт или на дне бокса."
      - "<gray>В боксе есть <red>PvP<gray>, будь осторожен!"
    tasks:
      1:
        type: BREAK_BLOCK
        keys: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
        amount: 25
        text: "Добыть <white>25<gray> блоков алмазной руды"
        label: "добыто"
      2:
        type: BREAK_BLOCK
        keys: [DIAMOND_BLOCK]
        amount: 15
        text: "Добыть <white>15<gray> алмазных блоков"
        label: "добыто"
    money: 1000
    reward-text: "1.000 ◉"
  2:
    description:
      - "<gray>Железо — основа любого снаряжения."
      - "<gray>Найди его в шахтах и пещерах."
    tasks:
      1:
        type: BREAK_BLOCK
        keys: [IRON_ORE, DEEPSLATE_IRON_ORE]
        amount: 64
        text: "Добыть <white>64<gray> железной руды"
        label: "добыто"
    money: 1500
    reward-text: "1.500 ◉"
  3:
    description:
      - "<gray>Бокс — место для настоящих бойцов."
      - "<gray>Покажи, на что ты способен!"
    tasks:
      1:
        type: KILL_PLAYER
        amount: 5
        text: "Убить <white>5<gray> игроков"
        label: "убито"
